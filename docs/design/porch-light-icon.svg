<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <!--
    Porch Light app icon, D2 "Lantern Beam", polished on the macOS icon grid.
    Canvas 1024. Body 824 x 824 at (100,100) with continuous corners (radius 185, smoothing 0.6).
    Drop shadow: black 30 %, y offset 12, blur 12, kept inside the 100 px margin.
    Rendered to 64 px and up by Scripts/render-icons.sh. The 16 and 32 px sizes come from
    porch-light-icon-small.svg.
  -->
  <defs>
    <path id="body" d="M628 100 c103.6 0 155.4 0 195 20.2 a185 185 0 0 1 80.8 80.8 c20.2 39.6 20.2 91.4 20.2 195 L924 628 c0 103.6 0 155.4 -20.2 195 a185 185 0 0 1 -80.8 80.8 c-39.6 20.2 -91.4 20.2 -195 20.2 L396 924 c-103.6 0 -155.4 0 -195 -20.2 a185 185 0 0 1 -80.8 -80.8 c-20.2 -39.6 -20.2 -91.4 -20.2 -195 L100 396 c0 -103.6 0 -155.4 20.2 -195 a185 185 0 0 1 80.8 -80.8 c39.6 -20.2 91.4 -20.2 195 -20.2 Z"/>
    <clipPath id="clip"><use href="#body"/></clipPath>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dy="12" result="blur"/>
      <feFlood flood-color="#000" flood-opacity=".3"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft10" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="soft3" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3"/></filter>

    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1A2045"/><stop offset="1" stop-color="#090B1D"/></linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity=".18"/><stop offset=".25" stop-color="#FFFFFF" stop-opacity="0"/></linearGradient>
    <radialGradient id="halo" cx="512" cy="336" r="175" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE0A0" stop-opacity=".8"/><stop offset=".45" stop-color="#FFC670" stop-opacity=".32"/><stop offset="1" stop-color="#FFC670" stop-opacity="0"/></radialGradient>
    <radialGradient id="wash" cx="512" cy="336" r="280" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFB45A" stop-opacity=".12"/><stop offset="1" stop-color="#FFB45A" stop-opacity="0"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="420" x2="0" y2="800" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE6A8" stop-opacity=".92"/><stop offset=".55" stop-color="#FFD088" stop-opacity=".55"/><stop offset="1" stop-color="#FFBF68" stop-opacity=".34"/></linearGradient>
    <linearGradient id="core" x1="0" y1="420" x2="0" y2="800" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFF6DE" stop-opacity=".6"/><stop offset="1" stop-color="#FFE6A8" stop-opacity=".16"/></linearGradient>
    <radialGradient id="pool"><stop offset="0" stop-color="#FFF3D2"/><stop offset=".4" stop-color="#FFD58A" stop-opacity=".8"/><stop offset=".78" stop-color="#FFB357" stop-opacity=".28"/><stop offset="1" stop-color="#FFB357" stop-opacity="0"/></radialGradient>
    <radialGradient id="spill"><stop offset="0" stop-color="#FFBE66" stop-opacity=".34"/><stop offset="1" stop-color="#FFB357" stop-opacity="0"/></radialGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE2A2"/><stop offset="1" stop-color="#F7A445"/></linearGradient>
    <linearGradient id="glass-side" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EDB168"/><stop offset="1" stop-color="#C9732B"/></linearGradient>
    <linearGradient id="flame" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFC25E"/><stop offset=".4" stop-color="#FFF0C6"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="roof" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#434A86"/><stop offset=".5" stop-color="#4C5494"/><stop offset=".5" stop-color="#363C70"/><stop offset="1" stop-color="#2E3462"/></linearGradient>
  </defs>

  <!-- Body with the drop shadow -->
  <use href="#body" fill="url(#bg)" filter="url(#shadow)"/>

  <g clip-path="url(#clip)">
    <!-- Halo around the lantern -->
    <circle cx="512" cy="336" r="280" fill="url(#wash)"/>
    <circle cx="512" cy="336" r="175" fill="url(#halo)"/>

    <!-- Spill on the floor, the cone with a brighter core, then the pool -->
    <ellipse cx="512" cy="792" rx="350" ry="80" fill="url(#spill)"/>
    <path d="M474 418 L550 418 L756 792 L268 792 Z" fill="url(#cone)" filter="url(#soft3)"/>
    <path d="M492 418 L532 418 L640 792 L384 792 Z" fill="url(#core)" filter="url(#soft10)"/>
    <ellipse cx="512" cy="792" rx="270" ry="52" fill="url(#pool)"/>

    <!-- Dust in the beam -->
    <g fill="#FFF6E0">
      <circle cx="478" cy="520" r="5" fill-opacity=".75"/>
      <circle cx="556" cy="588" r="4.5" fill-opacity=".6"/>
      <circle cx="496" cy="664" r="3.5" fill-opacity=".5"/>
      <circle cx="590" cy="712" r="4.5" fill-opacity=".45"/>
    </g>

    <!-- Short chain to the top edge: front links as rings, side links as bars -->
    <g fill="none" stroke="#424983" stroke-width="7">
      <ellipse cx="512" cy="110" rx="9" ry="17"/>
      <ellipse cx="512" cy="162" rx="9" ry="17"/>
    </g>
    <g fill="#424983">
      <rect x="508" y="123" width="8" height="26" rx="4"/>
      <rect x="508" y="175" width="8" height="22" rx="4"/>
    </g>

    <!-- Lantern cap: ring, roof, eave, collar -->
    <circle cx="512" cy="204" r="10" fill="none" stroke="#424983" stroke-width="7"/>
    <path d="M512 212 C526 236 556 254 598 262 L426 262 C468 254 498 236 512 212 Z" fill="url(#roof)"/>
    <rect x="416" y="258" width="192" height="18" rx="7" fill="#3A407A"/>
    <rect x="440" y="276" width="144" height="10" fill="#2C3263"/>

    <!-- Glass: two narrow side panes and a wide front pane with a candle flame -->
    <rect x="452" y="286" width="120" height="106" fill="url(#glass)"/>
    <rect x="452" y="286" width="26" height="106" fill="url(#glass-side)"/>
    <rect x="546" y="286" width="26" height="106" fill="url(#glass-side)"/>
    <ellipse cx="512" cy="344" rx="26" ry="38" fill="#FFF8E6" filter="url(#soft10)"/>
    <rect x="500" y="368" width="24" height="24" rx="3" fill="#FBEBD0"/>
    <path d="M512 304 C515 320 528 334 528 350 C528 361 521 368 512 368 C503 368 496 361 496 350 C496 334 509 320 512 304 Z" fill="url(#flame)"/>

    <!-- Frame: corner posts and mullions -->
    <g fill="#3A407A">
      <rect x="444" y="286" width="12" height="106"/>
      <rect x="568" y="286" width="12" height="106"/>
      <rect x="476" y="286" width="6" height="106"/>
      <rect x="542" y="286" width="6" height="106"/>
    </g>

    <!-- Base: rail and taper, open at the bottom where the beam comes out -->
    <rect x="436" y="390" width="152" height="14" rx="6" fill="#3A407A"/>
    <path d="M448 404 H576 L552 422 H472 Z" fill="#2C3263"/>

    <!-- Warm light catching the frame edges -->
    <g fill="#FFCF7A" fill-opacity=".45">
      <rect x="418" y="274" width="188" height="2" rx="1"/>
      <rect x="438" y="390" width="148" height="2" rx="1"/>
      <rect x="454" y="286" width="2" height="104"/>
      <rect x="568" y="286" width="2" height="104"/>
    </g>
  </g>

  <!-- Soft rim light along the top of the tile -->
  <use href="#body" fill="none" stroke="url(#rim)" stroke-width="3" clip-path="url(#clip)"/>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!--
    Porch Light app icon, simplified for 16 and 32 px (Scripts/render-icons.sh).
    One unit is one pixel at 32 px and half a pixel at 16 px, so every edge that matters sits on an
    even unit and lands on a whole pixel at both sizes. Body 24 x 24 at (4,4), which is 12 px at (2,2)
    at 16 px, the size Apple's own 16 px icons use. No chain links and only two-stop gradients.
    The hanger rod (2 units on the centre line) is the one part that is soft at 16 px.
  -->
  <defs>
    <path id="body" d="M19.36 4 c3.024 0 4.536 0 5.692 0.589 a5.4 5.4 0 0 1 2.36 2.36 c0.589 1.155 0.589 2.667 0.589 5.692 L28 19.36 c0 3.024 0 4.536 -0.589 5.692 a5.4 5.4 0 0 1 -2.36 2.36 c-1.155 0.589 -2.667 0.589 -5.692 0.589 L12.64 28 c-3.024 0 -4.536 0 -5.692 -0.589 a5.4 5.4 0 0 1 -2.36 -2.36 c-0.589 -1.155 -0.589 -2.667 -0.589 -5.692 L4 12.64 c0 -3.024 0 -4.536 0.589 -5.692 a5.4 5.4 0 0 1 2.36 -2.36 c1.155 -0.589 2.667 -0.589 5.692 -0.589 Z"/>
    <clipPath id="clip"><use href="#body"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur in="SourceAlpha" stdDeviation=".6"/>
      <feOffset dy=".5" result="blur"/>
      <feFlood flood-color="#000" flood-opacity=".35"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1C2249"/><stop offset="1" stop-color="#0B0D22"/></linearGradient>
    <radialGradient id="halo" cx="16" cy="11" r="8" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFC46A" stop-opacity=".4"/><stop offset="1" stop-color="#FFC46A" stop-opacity="0"/></radialGradient>
    <linearGradient id="cone" x1="0" y1="16" x2="0" y2="24" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FFE6A8" stop-opacity=".92"/><stop offset="1" stop-color="#FFC670" stop-opacity=".48"/></linearGradient>
  </defs>

  <use href="#body" fill="url(#bg)" filter="url(#shadow)"/>
  <g clip-path="url(#clip)">
    <circle cx="16" cy="11" r="8" fill="url(#halo)"/>
    <!-- Cone and pool -->
    <path d="M14 16 H18 L24 24 H8 Z" fill="url(#cone)"/>
    <rect x="8" y="24" width="16" height="2" rx="1" fill="#FFC768" fill-opacity=".7"/>
    <rect x="10" y="24" width="12" height="2" rx="1" fill="#FFEBC0"/>
    <!-- Hanger, roof and eave -->
    <rect x="15" y="4" width="2" height="2" fill="#3F467F"/>
    <path d="M14.5 5 H17.5 L21 7 H11 Z" fill="#3F467F"/>
    <rect x="10" y="6" width="12" height="2" rx=".5" fill="#3F467F"/>
    <!-- Glass with the flame, framed by two posts -->
    <rect x="12" y="8" width="8" height="6" fill="#3F467F"/>
    <rect x="14" y="8" width="4" height="6" fill="#FFC46A"/>
    <rect x="15" y="9" width="2" height="4" fill="#FFF7E0"/>
    <!-- Base -->
    <rect x="12" y="14" width="8" height="2" fill="#2E3462"/>
  </g>
</svg>
